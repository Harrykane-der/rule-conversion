name: rules merger

on:
  schedule:
    - cron: '0 */1 * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Set up Mihomo latest
        run: |
          LATEST_TAG=$(curl -fsSL https://github.com/MetaCubeX/mihomo/releases/latest/download/version.txt)
          curl -fsSL -o mihomo.gz https://github.com/MetaCubeX/mihomo/releases/download/${LATEST_TAG}/mihomo-linux-amd64-${LATEST_TAG}.gz
          gunzip mihomo.gz
          sudo mv mihomo /usr/local/bin/
          sudo chmod +x /usr/local/bin/mihomo

      - name: Set up sing-box 1.14.0-beta.4
        run: |
          VERSION=1.14.0-beta.4
          curl -fsSL -o sing-box.tar.gz https://github.com/SagerNet/sing-box/releases/download/v${VERSION}/sing-box-${VERSION}-linux-amd64.tar.gz
          tar -xzf sing-box.tar.gz
          sudo mv sing-box-${VERSION}-linux-amd64/sing-box /usr/local/bin/
          sudo chmod +x /usr/local/bin/sing-box
          rm -rf sing-box.tar.gz sing-box-${VERSION}-linux-amd64

      - name: Clear folder
        run: |
          find ./rules -mindepth 1 -delete

      - name: Run script
        run: python rules_merger.py

      - name: Force commit and push rules
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f rules/ 2>/dev/null
          git commit -m "🚀 Force update rules at $(date -u +'%Y-%m-%d %H:%M:%S')" 2>/dev/null || true
          git push origin ${{ github.ref_name }} 2>/dev/null || true
