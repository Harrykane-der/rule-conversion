name: rules merger

on:
  schedule:
    - cron: '0 */1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest

    steps:

      # 拉取仓库
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0


      # Python环境
      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip


      # 安装Python依赖
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # 下载最新版 Mihomo
      - name: Download Mihomo
        run: |
          set -e

          LATEST_TAG=$(curl -fsSL \
            https://github.com/MetaCubeX/mihomo/releases/latest/download/version.txt)

          echo "Mihomo version: ${LATEST_TAG}"

          curl -fsSL \
            -o mihomo.gz \
            https://github.com/MetaCubeX/mihomo/releases/download/${LATEST_TAG}/mihomo-linux-amd64-${LATEST_TAG}.gz

          gunzip mihomo.gz

          sudo install \
            -m 755 \
            mihomo \
            /usr/local/bin/mihomo

          mihomo -v


      # 下载 sing-box
      - name: Download sing-box
        run: |
          set -e

          VERSION="1.14.0-beta.4"

          echo "sing-box version: ${VERSION}"

          curl -fsSL \
            -o sing-box.tar.gz \
            https://github.com/SagerNet/sing-box/releases/download/v${VERSION}/sing-box-${VERSION}-linux-amd64.tar.gz

          tar -xzf sing-box.tar.gz

          sudo install \
            -m 755 \
            sing-box-${VERSION}-linux-amd64/sing-box \
            /usr/local/bin/sing-box

          rm -rf \
            sing-box.tar.gz \
            sing-box-${VERSION}-linux-amd64

          sing-box version


      # 删除旧规则
      - name: Remove old rules
        run: |
          rm -rf rules


      # 生成规则
      - name: Generate rule sets
        run: |
          set -e

          python rules_merger.py


      # 检查生成结果
      - name: Check generated rules
        run: |
          set -e

          if [ ! -d "rules" ]; then
            echo "⚠️ rules不存在，创建rules目录"
            mkdir -p rules
          fi

          if [ -z "$(ls -A rules)" ]; then
            echo "⚠️ rules为空，创建.gitkeep"
            touch rules/.gitkeep
          fi

          echo "✅ Generated rules:"
          ls -lh rules/


      # 强制提交覆盖
      - name: Force commit and push rules
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 删除旧索引记录
          git rm -rf --cached rules || true

          # 添加新规则
          git add -f rules

          # 无论是否变化都提交
          git commit \
            --allow-empty \
            -m "🚀 Update rule sets $(date -u +'%Y-%m-%d %H:%M:%S UTC')"

          # 强制推送当前分支
          git push \
            --force \
            origin HEAD:${{ github.ref_name }}
