name: rules merger

on:
  schedule:
    - cron: '0 */1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Set up Mihomo latest
        run: |
          LATEST_TAG=$(curl -fsSL https://github.com/MetaCubeX/mihomo/releases/latest/download/version.txt)

          curl -fsSL \
            -o mihomo.gz \
            https://github.com/MetaCubeX/mihomo/releases/download/${LATEST_TAG}/mihomo-linux-amd64-${LATEST_TAG}.gz

          gunzip mihomo.gz

          sudo mv mihomo /usr/local/bin/mihomo
          sudo chmod +x /usr/local/bin/mihomo

          mihomo -v

      - name: Set up sing-box 1.14.0-beta.4
        run: |
          VERSION=1.14.0-beta.4

          curl -fsSL \
            -o sing-box.tar.gz \
            https://github.com/SagerNet/sing-box/releases/download/v${VERSION}/sing-box-${VERSION}-linux-amd64.tar.gz

          tar -xzf sing-box.tar.gz

          sudo mv sing-box-${VERSION}-linux-amd64/sing-box /usr/local/bin/sing-box
          sudo chmod +x /usr/local/bin/sing-box

          rm -rf sing-box.tar.gz sing-box-${VERSION}-linux-amd64

          sing-box version

      - name: Clear old rules
        run: |
          mkdir -p rules
          find ./rules -mindepth 1 -delete

      - name: Run rules merger
        run: |
          python rules_merger.py

      - name: Force update rules
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -f rules/

          git commit \
            -m "🚀 Force update rules at $(date -u +'%Y-%m-%d %H:%M:%S')" \
            || true

          git push \
            --force-with-lease \
            origin HEAD:${{ github.ref_name }}
