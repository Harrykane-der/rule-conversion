name: rules merger

on:
  schedule:
    - cron: '0 */1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest

    steps:

      # 拉取仓库
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0


      # Python环境
      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip


      # 安装Python依赖
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # 下载最新版 Mihomo
      - name: Download Mihomo
        run: |
          set -e

          LATEST_TAG=$(curl -fsSL \
            https://github.com/MetaCubeX/mihomo/releases/latest/download/version.txt)

          echo "Mihomo version: ${LATEST_TAG}"

          curl -fsSL \
            -o mihomo.gz \
            https://github.com/MetaCubeX/mihomo/releases/download/${LATEST_TAG}/mihomo-linux-amd64-${LATEST_TAG}.gz

          gunzip mihomo.gz

          sudo install -m 755 mihomo /usr/local/bin/mihomo

          mihomo -v


      # 下载 sing-box
      - name: Download sing-box
        run: |
          set -e

          VERSION="1.14.0-beta.4"

          echo "sing-box version: ${VERSION}"

          curl -fsSL \
            -o sing-box.tar.gz \
            https://github.com/SagerNet/sing-box/releases/download/v${VERSION}/sing-box-${VERSION}-linux-amd64.tar.gz

          tar -xzf sing-box.tar.gz

          sudo install \
            -m 755 \
            sing-box-${VERSION}-linux-amd64/sing-box \
            /usr/local/bin/sing-box

          rm -rf \
            sing-box.tar.gz \
            sing-box-${VERSION}-linux-amd64

          sing-box version


      # 清理旧规则
      - name: Clean old rules
        run: |
          mkdir -p rules
          rm -rf rules/*


      # 运行转换合并脚本
      - name: Generate rule sets
        run: |
          python rules_merger.py


      # 检查生成结果
      - name: Check generated rules
        run: |
          if [ ! "$(ls -A rules)" ]; then
            echo "❌ rules目录为空，停止提交"
            exit 1
          fi

          echo "✅ Generated rules:"
          ls -lh rules/


      # 提交并强制更新
      - name: Commit and force push rules
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -f rules/

          git commit \
            -m "🚀 Update rule sets $(date -u +'%Y-%m-%d %H:%M:%S')" \
            || echo "No changes"

          git fetch origin ${{ github.ref_name }}

          git push \
            --force-with-lease \
            origin HEAD:${{ github.ref_name }}
